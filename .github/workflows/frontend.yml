name: Frontend CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'digidoc-travel-frontend/**'
  pull_request:
    branches: [develop]
    paths:
      - 'digidoc-travel-frontend/**'

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: digidoc-travel-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./digidoc-travel-frontend
        run: npm ci

      - name: Lint
        working-directory: ./digidoc-travel-frontend
        run: npm run lint

      - name: Build
        working-directory: ./digidoc-travel-frontend
        run: npm run build

      - name: Test
        working-directory: ./digidoc-travel-frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./digidoc-travel-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy frontend to staging"
          # Add deployment commands

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to production
        run: |
          echo "Deploy frontend to production"
          # Add deployment commands
